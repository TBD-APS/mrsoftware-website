<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Links between pages</title>
  <link rel="stylesheet" href="/css/linking.css">
  <style>
    body { margin: 0 auto; max-width: 52rem; padding: 24px 16px 64px; font: 16px/1.5 Georgia, serif; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 8px; }
  </style>
</head>
<body class="link-backoffice">
  <header>
    <p>Website backoffice</p>
    <h1>Links between pages</h1>
    <p>Pick a page, then add the pages a reader should open next. Save writes the catalogue on this computer. Publish the site for the public pages to catch up.</p>
  </header>
  <nav id="pages" class="link-pages" aria-label="Pages"></nav>
  <div id="editor"></div>
  <button id="save" type="button">Save links</button>
  <p id="status" aria-live="polite"></p>
  <script type="module" src="/backoffice/editor.js"></script>
</body>
</html>
