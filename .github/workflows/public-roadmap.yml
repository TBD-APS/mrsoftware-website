name: Sync public feature roadmap

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      propose:
        description: Open a review PR if the preview changes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-product-roadmap
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'TBD-APS/mrsoftware-website' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PUBLIC_ROADMAP_SYNC == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Refresh public features from Linear
        id: update
        env:
          LINEAR_ROADMAP_TOKEN: ${{ secrets.LINEAR_ROADMAP_TOKEN }}
        run: |
          node tools/sync-public-roadmap.mjs
          if git diff --quiet -- roadmap/index.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test the proposed website
        if: steps.update.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Show the proposed public changes
        if: steps.update.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        run: git diff -- roadmap/index.html
      - name: Propose the tested feature list
        if: steps.update.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.propose)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_ROADMAP_GH_TOKEN }}
        run: bash tools/propose-roadmap.sh
