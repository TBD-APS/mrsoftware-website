name: Repository baseline

# Repository-owned checks use read-only permissions and no deployment credentials.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  schedule:
    - cron: '31 3 * * 0'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: saasy-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: node --test tests/repository-baseline.test.mjs
      - run: node tools/repository-baseline.mjs title
  branch-hygiene:
    name: Audit merged PR branches
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Write the read-only branch report
        run: node tools/repository-baseline.mjs audit
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-branch-hygiene
          path: .local/baseline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
