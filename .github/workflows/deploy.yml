name: Deploy owner-merged website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mrsoftware-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Require the exact current main PR merged by Rasmus
        run: node tools/release-eligibility.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --no-audit --no-fund
      - name: Verify the release guards, Access boundary and synthetic browser journeys
        run: npm test

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: mrsoftware-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Recheck main after any production environment wait
        run: node tools/release-eligibility.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --no-audit --no-fund
      - name: Prepare the private reviewed dashboard snapshot
        run: node tools/dashboard-snapshot.mjs unpack
        env:
          MR_SOFTWARE_DASHBOARD_SNAPSHOT_1: ${{ secrets.MR_SOFTWARE_DASHBOARD_SNAPSHOT_1 }}
          MR_SOFTWARE_DASHBOARD_SNAPSHOT_2: ${{ secrets.MR_SOFTWARE_DASHBOARD_SNAPSHOT_2 }}
          MR_SOFTWARE_DASHBOARD_SNAPSHOT_3: ${{ secrets.MR_SOFTWARE_DASHBOARD_SNAPSHOT_3 }}
          MR_SOFTWARE_DASHBOARD_SNAPSHOT_4: ${{ secrets.MR_SOFTWARE_DASHBOARD_SNAPSHOT_4 }}
          MR_SOFTWARE_DASHBOARD_SHA256: ${{ vars.MR_SOFTWARE_DASHBOARD_SHA256 }}
      - name: Upload and deploy the exact version, then verify production
        run: node tools/deploy-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Retain only the safe release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrsoftware-release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private runner inputs and build output
        if: always()
        run: |
          node --input-type=module -e 'import {rm} from "node:fs/promises"; if (process.env.DASHBOARD_SNAPSHOT_DIR) await rm(process.env.DASHBOARD_SNAPSHOT_DIR,{recursive:true,force:true}); for (const path of [".local/private-dashboard.json",".local/dashboard-provenance.json",".wrangler"]) await rm(path,{recursive:true,force:true});'
